server {
    listen 80;
    server_name votre-domaine.com www.votre-domaine.com;
    root /usr/share/nginx/html;
    index index.html;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gestion des URLs propres
    location ~ ^/article/([a-zA-Z0-9-]+)/?$ {
        try_files $uri /pages/article.html?id=$1;
    }

    location ~ ^/blog/([a-zA-Z0-9-]+)/?$ {
        try_files $uri /pages/blog.html?category=$1;
    }

    location /blog {
        try_files $uri /pages/blog.html;
    }

    # Gestion de la racine et des extensions .html
    location = / {
        try_files /pages/index.html =404;
    }
    
    # Redirection des pages légales vers le dossier pages
    location ~ ^/(mentions-legales|politique-confidentialite)\.html$ {
        return 301 /pages$request_uri;
    }
    
    location / {
        try_files $uri $uri.html $uri/ /pages$uri /pages$uri.html =404;
    }

    # Pas de redirection des .html pour éviter les boucles infinies

    # Cache des fichiers statiques
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gestion des erreurs
    error_page 404 /pages/404.html;
    error_page 500 502 503 504 /50x.html;

    # Endpoint pour le monitoring
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.0.0.0/8;  # Docker networks
        deny all;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

