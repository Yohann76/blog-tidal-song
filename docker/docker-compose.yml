version: '3.8'

services:
  # Service principal du site web
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: chant-des-marees-web
    ports:
      - "80:80"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    restart: unless-stopped
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

networks:
  default:
    name: chant-des-marees-network